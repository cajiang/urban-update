name: Daily refresh (keyless) + Pages

# Refreshes the day-to-day feeds and republishes the dashboard to GitHub Pages
# on a daily schedule (and on demand via the "Run workflow" button). It uses NO
# API keys: the keyless feeds (DOB / DOF / HPD / 311 / ECB via NYC Open Data,
# FRED for Capital) refresh live, while the Census (Demand, annual) and the paid
# AI Brief steps skip gracefully and keep their committed outputs. Those two are
# regenerated locally via run.ps1, so no secret ever touches GitHub.

on:
  schedule:
    - cron: '20 11 * * *'    # daily at 11:20 UTC (~07:20 America/New_York)
  workflow_dispatch: {}       # manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25        # safety ceiling: NYC Open Data can be slow from CI (retries)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Report source freshness (informational)
        run: node src/check-sources.mjs || true   # exits 10 when updates exist; never fails the run

      - name: Refresh keyless feeds + rebuild dashboard
        run: node src/refresh.mjs
        # No API keys are set here, so:
        #   - demand.mjs  (Census)  skips and keeps the committed demand.json
        #   - narrate.mjs (Brief)   skips and keeps the committed narratives.json
        # while Development / Transactions / Risk / LL97 / Capital refresh live
        # and the dashboard is rebuilt with the fresh data.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard         # publish dashboard/index.html as the site root

      - id: deploy
        uses: actions/deploy-pages@v4
